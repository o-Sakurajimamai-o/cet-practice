name: Build and verify macOS apps

on:
  push:
    branches: [macos-support-v1.1.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        run: python -m pip install -r packaging/requirements-macos.txt
      - name: Fetch and verify public question bank and audio
        run: python packaging/fetch_release_data.py
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Backend regressions (temporary databases only)
        run: python tests/test_backend_regressions.py
      - name: Build and sign app bundle
        run: python packaging/build_macos.py --arch '${{ matrix.arch }}'
      - name: Install browser verification tools (not bundled)
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install webkit
      - name: Verify extracted delivery ZIP on macOS
        run: python tests/test_macos_package.py --arch '${{ matrix.arch }}'
      - name: Upload verified packages and reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS-${{ matrix.arch }}
          path: release-assets/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
