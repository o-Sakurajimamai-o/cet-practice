name: Build and verify v1.4.0
on:
  push:
    branches: [release-v1.4.0-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, platform: Windows-x64, arch: x64, edition: NoAudio}
          - {runner: windows-2025, platform: Windows-x64, arch: x64, edition: WithAudio}
          - {runner: macos-14, platform: macOS-arm64, arch: arm64, edition: NoAudio}
          - {runner: macos-14, platform: macOS-arm64, arch: arm64, edition: WithAudio}
          - {runner: macos-15-intel, platform: macOS-x86_64, arch: x86_64, edition: NoAudio}
          - {runner: macos-15-intel, platform: macOS-x86_64, arch: x86_64, edition: WithAudio}
    name: ${{ matrix.platform }}-${{ matrix.edition }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install Windows build requirements
        if: startsWith(matrix.platform, 'Windows')
        run: python -m pip install -r packaging/requirements-build.txt playwright==1.56.0
      - name: Install Mac build requirements
        if: startsWith(matrix.platform, 'macOS')
        run: python -m pip install -r packaging/requirements-macos.txt playwright==1.56.0
      - name: Install WebKit
        if: startsWith(matrix.platform, 'macOS')
        run: python -m playwright install webkit
      - name: Fetch audio and legacy upgrade fixture
        run: python packaging/fetch_release_data.py
      - name: Fetch sanitized question bank from draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python packaging/fetch_build_seed.py
      - name: Audit and install public question bank
        run: python packaging/install_build_seed.py
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Backend regression checks
        run: python tests/test_backend_regressions.py
      - name: Build Windows package
        if: startsWith(matrix.platform, 'Windows')
        run: |
          python packaging/build_windows.py --edition ${{ matrix.edition }}
          python packaging/package_windows.py --edition ${{ matrix.edition }}
      - name: Build Mac package
        if: startsWith(matrix.platform, 'macOS')
        run: python packaging/build_macos.py --arch ${{ matrix.arch }} --edition ${{ matrix.edition }}
      - name: Verify package on target OS
        run: python tests/test_release_v140.py --platform ${{ matrix.platform }} --edition ${{ matrix.edition }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.platform }}-${{ matrix.edition }}
          path: release-assets/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
